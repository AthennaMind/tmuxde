version: 2
project_name: tmuxde

builds:
  - id: tmuxde
    main: ./cmd/tmuxde
    binary: tmuxde
    env: [CGO_ENABLED=0, GOPROXY=off, GOTOOLCHAIN=local]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -mod=vendor]
    ldflags:
      - -s -w -buildid= -X main.version={{.Version}}
  - id: tmuxde-stt
    main: ./cmd/tmuxde-stt
    binary: tmuxde-stt
    env:
      - CGO_ENABLED=1
      - GOPROXY=off
      - GOTOOLCHAIN=local
      - 'CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}'
      - 'CGO_CFLAGS=-I{{ .Env.STT_ASSET_DIR }}/include'
      - 'CGO_LDFLAGS=-L{{ .Env.STT_ASSET_DIR }}/{{ .Arch }}/lib -Wl,--start-group -lsherpa-onnx-c-api -lsherpa-onnx-core -lkaldi-decoder-core -lsherpa-onnx-kaldifst-core -lsherpa-onnx-fstfar -lsherpa-onnx-fst -lkaldi-native-fbank-core -lkissfft-float -lonnxruntime -lssentencepiece_core -Wl,--end-group -lstdc++ -lm -ldl -lpthread'
    goos: [linux]
    goarch: [amd64, arm64]
    tags: [sherpa, stt_bundle, netgo, osusergo]
    flags: [-trimpath, -mod=vendor]
    ldflags:
      - -s -w -buildid= -X main.version={{.Version}} -linkmode external -extldflags -static

archives:
  - id: tmuxde
    ids: [tmuxde]
    formats: [tar.gz]
    name_template: 'tmuxde_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md]
  - id: tmuxde-stt
    ids: [tmuxde-stt]
    formats: [tar.gz]
    name_template: 'tmuxde-stt_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, internal/stt/README.md, docs/stt-notices.md]

checksum:
  name_template: checksums.txt

# Keyless cosign through GitHub OIDC. The certificate names the release
# workflow and tag, so no signing secret exists anywhere.
signs:
  - id: checksums
    cmd: cosign
    # cosign 3 writes signature, certificate and log entry into one bundle.
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^Merge '

# Draft until the images exist. The publish job writes the final notes.
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto

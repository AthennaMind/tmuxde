# mtmux — docker sidecar config
#
# Used by the `nginx` service in docker-compose.prod.yml. Service names
# (web / relay / docs) are resolved via docker's internal DNS.
#
# TLS is bring-your-own-cert: mount your Let's Encrypt directory at
# /etc/letsencrypt and uncomment the HTTPS server block below. Otherwise
# only the HTTP server is active for local / behind-another-proxy use.

upstream mtmux_web {
    server web:14100;
}

upstream mtmux_relay {
    server relay:14300;
}

upstream mtmux_docs {
    server docs:14102;
}

# --- HTTP (also handles ACME http-01 before TLS is issued) ----------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Relay WebSocket
    location /ws {
        proxy_pass http://mtmux_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /docs {
        proxy_pass http://mtmux_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://mtmux_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


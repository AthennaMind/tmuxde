name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full-checks:
        description: Run Go and UI checks regardless of changed paths
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  DO_NOT_TRACK: '1'

jobs:
  all-checks:
    name: All checks passed
    needs: [changes, gitleaks, lint, go, integration, ui, speech-assets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          echo "All required jobs passed."

  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ inputs.full-checks || github.event.forced || steps.filter.outputs.go == 'true' }}
      ui: ${{ inputs.full-checks || github.event.forced || steps.filter.outputs.ui == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Go and UI changes
        # A force-push may remove the previous commit from history.
        if: ${{ !inputs.full-checks && !github.event.forced }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Use local Git for PRs and pushes without additional API permissions.
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.ref_name }}
          filters: |
            go:
              - '**/*.go'
              - 'cmd/**'
              - 'internal/**'
              - 'web/**'
              - 'vendor/**'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.golangci.yml'
              # Go contract tests read UI protocol schemas and fixtures.
              - 'ui/src/protocol/**'
              - '.github/workflows/**'
              - '.goreleaser.yaml'
            ui:
              - 'ui/**'
              - '.github/workflows/**'
              - '.goreleaser.yaml'

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Gitleaks download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/gitleaks-downloads
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install verified Gitleaks release
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p gitleaks-downloads gitleaks-bin
          archive="gitleaks-downloads/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if ! echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --status; then
            curl --fail --location --retry 3 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o "$archive"
          fi
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan checked-out Git history
        run: gitleaks git --redact --verbose --no-banner --log-opts=HEAD .

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --build-tags=integration --timeout=5m ./...

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=1 go test -race ./cmd/tmuxde-stt/... ./internal/stt/...

  integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Integration (tmux ${{ matrix.tmux }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tmux: '3.7c'
            sha256: 7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf
          - tmux: '3.8'
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      TMUX_VERSION: ${{ matrix.tmux }}
      TMUX_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Cache pinned tmux
        id: tmux-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ matrix.tmux }}-${{ matrix.sha256 }}
      - name: Install tmux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison pkg-config libevent-dev libncurses-dev git
      - name: Build pinned tmux
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" \
            -o tmux.tar.gz
          printf '%s  tmux.tar.gz\n' "$TMUX_SHA256" | sha256sum --check
          tar -xzf tmux.tar.gz
          cd "tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/tmux"
          make -j"$(nproc)"
          make install
      - name: Add tmux to PATH
        run: echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - name: Run integration tests
        run: |
          test "$(tmux -V)" = "tmux $TMUX_VERSION"
          go test -tags=integration -run '^TestIntegration' -count=1 -timeout=10m ./...

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    name: UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.11.2'
          package_json_file: ui/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --offline --config.trustLockfile=true rebuild --pending
      - name: Typecheck and test
        working-directory: ui
        run: |
          pnpm exec tsc
          pnpm exec vitest run --configLoader native

  speech-assets:
    name: Cache speech downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check for cached speech downloads
        id: speech-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/stt-downloads
          key: stt-downloads-v1-${{ hashFiles('cmd/tmuxde-stt/assets.json') }}
          lookup-only: true
      - name: Cache speech downloads
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/stt-downloads
          key: stt-downloads-v1-${{ hashFiles('cmd/tmuxde-stt/assets.json') }}
          restore-keys: stt-downloads-v1-
      - name: Download and verify speech assets
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/stt-downloads
          jq -r '[.header, .libraries[], .c_api_sources[], .c_api_headers[], .models[]] | unique_by(.sha256)[] | [.url, .sha256] | @tsv' cmd/tmuxde-stt/assets.json |
          while IFS=$'\t' read -r url checksum; do
            asset=".cache/stt-downloads/$checksum"
            if ! echo "$checksum  $asset" | sha256sum --check --status; then
              curl --fail --location --retry 3 "$url" -o "$asset"
            fi
            echo "$checksum  $asset" | sha256sum --check
          done

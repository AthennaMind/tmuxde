name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm provenance: the publish is signed against this workflow run, so the
  # bundled web client can be tied back to a commit. This is the concrete
  # answer to "you serve the JavaScript that does the crypto" — it costs one
  # flag and one permission.
  id-token: write

jobs:
  # Everything a pull request runs, on the tagged tree. Nothing publishes
  # until this passes: a tag on a broken tree used to reach npm because the
  # two jobs below ran in parallel with no `needs:` and no checks of their own.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  github-release:
    name: Create GitHub Release
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish mtmux to npm
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mtmux build
      - name: Publish
        working-directory: apps/cli
        # A tag with a pre-release suffix publishes under `next`, so
        # `npm i -g mtmux` never installs a release candidate by accident.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

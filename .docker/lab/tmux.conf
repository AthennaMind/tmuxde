# The lab's tmux, pinned.
#
# Determinism is the entire point. A screenshot baseline that differs between
# runs is worthless as a regression, and a status line carrying a hostname, a
# clock or a session-window count would change on every single run — so there
# is no status line here at all.
#
# Loaded with `-f`, on a private `-S` socket, exactly as
# `apps/relay/src/tmux-manager.test.ts` already does it. That file is the proven
# template for this whole approach and this is the same pattern at container
# scale.

# The pane shell, stated rather than inherited.
#
# tmux takes `default-shell` from `$SHELL` or the user's passwd entry, and the
# relay image's `relay` user is a system account with no login shell — so every
# pane came up as `/bin/sh`. That matters twice: `seed.sh` waits for an
# interactive shell before typing a command into a pane, and the relay's own
# `TMUX_DEFAULT_SHELL` is a *relay* setting that tmux never sees.
set -g default-shell "/bin/bash"
set -g default-command "/bin/bash"

set -g default-terminal "tmux-256color"

# The client advertises truecolour and the `colors` profile streams 24-bit
# ramps at it. Without this tmux quantises them to 256 and the fidelity
# detector would be comparing two different renderings of the same bytes.
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse reporting on: the `altscreen` profile exists to exercise it, and the
# scroll rail's reason for existing is that tmux owns the alternate screen.
set -g mouse on

# Large enough for the scroll rail to have something to measure, small enough
# that thirteen sessions do not sit on a gigabyte. `scrollback` raises this for
# itself in seed.sh and puts it back.
set -g history-limit 10000

# No status line, no clock, no activity flags, no bells rung at the client —
# every one of them is a source of run-to-run pixel drift.
set -g status off
set -g visual-activity off
set -g visual-bell off
set -g monitor-activity off
set -g bell-action none

# Fixed prefix and fixed escape time so an input test measures the app's
# latency rather than tmux waiting to see whether an Escape was a meta key.
set -g prefix C-b
set -sg escape-time 0

# A dead pane must stay on screen. The `garbage` and `ctrlseq` profiles are
# allowed to end; if tmux reaped the window the session would silently change
# shape underneath a running sweep.
set -g remain-on-exit on

# Fixed geometry for a detached server. tmux sizes a detached session to these,
# and `reflow.ts` asserts the cols/rows the client negotiates *against* what
# tmux reports — so this being stable is load-bearing.
set -g default-size 120x40

setw -g automatic-rename off
setw -g allow-rename off
set -g set-titles off

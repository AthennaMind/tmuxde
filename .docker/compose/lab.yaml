name: mtmux-lab
services:
  lab:
    extends:
      file: workspace.yaml
      service: workspace
    image: mtmux-lab:latest
    build:
      context: ../..
      dockerfile: .docker/lab/Dockerfile
    pull_policy: never
    entrypoint: [/lab/entrypoint.sh]
    environment:
      HOME: /tmp/lab
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TERM: xterm-256color
      LAB_LOCAL: "1"
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "24300"
      AUTH_TOKEN: ${LAB_AUTH_TOKEN:-mtmux-lab-token-not-for-production}
      CORS_ORIGINS: http://127.0.0.1:${LAB_WEB_PORT:-14190},http://localhost:${LAB_WEB_PORT:-14190}
      TMUX_SOCKET: /run/lab/tmux.sock
      LAB_SOCKET: /run/lab/tmux.sock
      ALLOWED_PATHS: /lab
      MTMUX_CONFIG_DIR: /tmp/lab-state
      LAB_FIREHOSE_LPS: ${LAB_FIREHOSE_LPS:-5000}
      LAB_SCROLLBACK_LINES: ${LAB_SCROLLBACK_LINES:-50000}
      NODE_ENV: development
    volumes:
      - type: volume
        source: cache
        target: /workspace/apps/web
        volume:
          nocopy: true
          subpath: web-lab-metadata
    network_mode: none
    tmpfs:
      - /run/lab:rw,noexec,nosuid,nodev,mode=1777,size=32m
      - /lab/work:rw,noexec,nosuid,nodev,mode=1777,size=32m
    stop_grace_period: 3s
volumes:
  dependencies:
    external: true
    name: mtmux-dev-dependencies-v2
  cache:
    external: true
    name: mtmux-dev-cache-v2
  pnpm-store:
    external: true
    name: mtmux-dev-pnpm-store

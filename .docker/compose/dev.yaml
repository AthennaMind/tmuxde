name: tmuxde
networks:
  edge:
    name: tmuxde_edge
  offline:
    internal: true
    name: tmuxde_offline
  # Relay and speech service only. Web and Caddy cannot reach it.
  speech:
    internal: true
    name: tmuxde_speech
services:
  caddy:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    depends_on:
      relay:
        condition: service_healthy
        required: true
      web:
        condition: service_healthy
        required: true
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost}
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    networks:
      edge: null
      offline: null
    pids_limit: 512
    ports:
      - ${LOCAL_BIND_IP:-127.0.0.1}:443:443
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ../Caddyfile
        target: /etc/caddy/Caddyfile
        type: bind
      - source: caddy-data
        target: /data
        type: volume
        volume: {}
      - source: caddy-config
        target: /config
        type: volume
        volume: {}
  relay:
    extends:
      file: workspace.yaml
      service: relay-workspace
    command:
      - pnpm
      - --filter
      - "@app/relay"
      - dev
    healthcheck:
      interval: 10s
      start_period: 15s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:24300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 5s
    labels:
      dev.tmuxde.mode: development
    networks:
      offline: null
      speech: null
    restart: unless-stopped
    user: ${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}
    depends_on:
      deps-build:
        condition: service_completed_successfully
      # Browsers learn about dictation once, at login. Waiting for the model
      # keeps phones that reconnect during a restart from losing the mic.
      # Ignored when profile `dictation` is off.
      stt:
        condition: service_healthy
        required: false
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "24300"
      TMUX_SOCKET: /host-tmux/${LOCAL_TMUX_SOCKET:?Run scripts/setup.sh}
      AUTH_TOKEN: ${AUTH_TOKEN:?Run scripts/setup.sh}
      CORS_ORIGINS: https://${LOCAL_DOMAIN:-localhost}
      ALLOWED_PATHS: ${LOCAL_UPLOAD_DIR:?Run
        scripts/setup.sh},${LOCAL_HOST_HOME:?Run scripts/setup.sh}
      HOME: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
      TMUXDE_CONFIG_DIR: /tmp/tmuxde-state
      # Empty unless setup enabled dictation. Relay then offers no mic.
      STT_URL: ${STT_URL:-}
    volumes:
      - bind:
          create_host_path: false
        source: ${LOCAL_TMUX_DIR:?Run scripts/setup.sh}
        target: /host-tmux
        type: bind
      - bind:
          create_host_path: false
        read_only: true
        source: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
        target: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../host-tmux
        target: /opt/host-tmux
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../tmux-client
        target: /usr/local/bin/tmux
        type: bind
      - bind:
          create_host_path: false
        source: ${LOCAL_UPLOAD_DIR:?Run scripts/setup.sh}
        target: ${LOCAL_UPLOAD_DIR:?Run scripts/setup.sh}
        type: bind
  # Optional speech to text. Starts only with profile `dictation`, which
  # `scripts/setup.sh --dictation` writes to `.env` as COMPOSE_PROFILES.
  stt:
    extends:
      file: workspace.yaml
      service: runtime
    profiles:
      - dictation
    command:
      - node
      - --watch
      - apps/stt/src/index.ts
    cpus: ${STT_THREADS:-4}
    mem_limit: 3g
    healthcheck:
      interval: 10s
      start_period: 30s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:24400/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 5s
    labels:
      dev.tmuxde.mode: development
    networks:
      speech: null
    restart: unless-stopped
    user: ${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}
    depends_on:
      deps-build:
        condition: service_completed_successfully
    environment:
      STT_HOST: 0.0.0.0
      STT_PORT: "24400"
      STT_MODEL_DIR: /models/parakeet-tdt-0.6b-v3-int8
      STT_VAD_MODEL: /models/silero-vad/silero_vad.onnx
      STT_THREADS: ${STT_THREADS:-4}
    volumes:
      - bind:
          create_host_path: false
        read_only: true
        source: ${LOCAL_STT_MODELS:-/nonexistent}
        target: /models
        type: bind
  web:
    extends:
      file: workspace.yaml
      service: web-workspace
    command:
      - pnpm
      - --filter
      - "@app/web"
      - exec
      - next
      - dev
      - --hostname
      - 0.0.0.0
      - --port
      - "24100"
    healthcheck:
      interval: 10s
      start_period: 90s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:24100/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 10s
    labels:
      dev.tmuxde.mode: development
    networks:
      offline: null
    restart: unless-stopped
    user: ${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}
    depends_on:
      deps-build:
        condition: service_completed_successfully
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_DIST_DIR: .next-dev
      NEXT_PUBLIC_RELAY_URL: ""
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost}
  volume-init:
    extends:
      file: tooling.yaml
      service: volume-init
  deps-manager:
    extends:
      file: tooling.yaml
      service: deps-manager
    depends_on:
      volume-init:
        condition: service_completed_successfully
  deps-build:
    extends:
      file: tooling.yaml
      service: deps-build
    depends_on:
      deps-manager:
        condition: service_completed_successfully
  tools:
    extends:
      file: tooling.yaml
      service: tools
    profiles:
      - tools
    depends_on:
      deps-build:
        condition: service_completed_successfully
volumes:
  cache:
    name: tmuxde-dev-cache-v2
  caddy-config:
    name: tmuxde_caddy-config
  caddy-data:
    name: tmuxde_caddy-data
  dependencies:
    name: tmuxde-dev-dependencies-v2
  pnpm-store:
    name: tmuxde-dev-pnpm-store

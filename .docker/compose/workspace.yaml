services:
  runtime:
    image: "tmuxde-dev:local"
    build:
      context: "../.."
      dockerfile: ".docker/dev/Dockerfile"
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: "4g"
    cpus: 4
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,mode=1777,size=1g"
    working_dir: "/workspace"
    environment:
      DO_NOT_TRACK: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      PNPM_HOME: "/tmp/pnpm"
      npm_config_nodedir: "/usr/local"
      CI: "${CI:-}"
    volumes:
      - type: "bind"
        source: "../../package.json"
        target: "/workspace/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../pnpm-lock.yaml"
        target: "/workspace/pnpm-lock.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../pnpm-workspace.yaml"
        target: "/workspace/pnpm-workspace.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../.gitignore"
        target: "/workspace/.gitignore"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../tsconfig.base.json"
        target: "/workspace/tsconfig.base.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../vitest.config.ts"
        target: "/workspace/vitest.config.ts"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../stt"
        target: "/workspace/stt"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../packages"
        target: "/workspace/packages"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../scripts"
        target: "/workspace/scripts"
        read_only: true
        bind:
          create_host_path: false
      - type: "volume"
        source: "dependencies"
        target: "/workspace/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "root"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/stt/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "stt"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/ui/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "ui"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/crypto/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "packages-crypto"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/protocol/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "packages-protocol"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/ui-kit/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "packages-ui-kit"
      - type: "volume"
        source: "pnpm-store"
        target: "/pnpm/store"
        read_only: true
        volume:
          nocopy: true
      - type: "bind"
        source: "../../ui/components.json"
        target: "/workspace/ui/components.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/index.html"
        target: "/workspace/ui/index.html"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/package.json"
        target: "/workspace/ui/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/postcss.config.mjs"
        target: "/workspace/ui/postcss.config.mjs"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/public"
        target: "/workspace/ui/public"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/src"
        target: "/workspace/ui/src"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/tsconfig.json"
        target: "/workspace/ui/tsconfig.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/vite.config.ts"
        target: "/workspace/ui/vite.config.ts"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/vitest.config.idb.ts"
        target: "/workspace/ui/vitest.config.idb.ts"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/vitest.config.ts"
        target: "/workspace/ui/vitest.config.ts"
        read_only: true
        bind:
          create_host_path: false
  workspace:
    extends:
      service: runtime
    environment:
      HOME: "/tmp/tmuxde-dev"
    volumes:
      - type: "volume"
        source: "cache"
        target: "/workspace/.cache"
        read_only: false
        volume:
          nocopy: true
          subpath: "workspace-cache"
      - type: "volume"
        source: "cache"
        target: "/workspace/ui"
        volume:
          nocopy: true
          subpath: "ui-tooling-metadata"
      - type: "volume"
        source: "cache"
        target: "/workspace/ui/.vite"
        read_only: false
        volume:
          nocopy: true
          subpath: "ui-vite"
  ui-workspace:
    extends:
      service: runtime
    environment:
      HOME: "/tmp/tmuxde-dev"
    volumes:
      - type: "volume"
        source: "cache"
        target: "/workspace/ui"
        volume:
          nocopy: true
          subpath: "ui-dev-metadata"
      - type: "volume"
        source: "cache"
        target: "/workspace/ui/.vite"
        read_only: false
        volume:
          nocopy: true
          subpath: "ui-vite"
  installer:
    image: "tmuxde-dev:local"
    build:
      context: "../.."
      dockerfile: ".docker/dev/Dockerfile"
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: "4g"
    cpus: 4
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,mode=1777,size=1g"
      - "/workspace:rw,noexec,nosuid,nodev,mode=1777,size=256m"
      - '/workspace/stt:rw,noexec,nosuid,nodev,mode=1777,size=8m'
      - '/workspace/ui:rw,noexec,nosuid,nodev,mode=1777,size=8m'
      - '/workspace/packages/crypto:rw,noexec,nosuid,nodev,mode=1777,size=8m'
      - '/workspace/packages/protocol:rw,noexec,nosuid,nodev,mode=1777,size=8m'
      - '/workspace/packages/ui-kit:rw,noexec,nosuid,nodev,mode=1777,size=8m'
    working_dir: "/workspace"
    environment:
      DO_NOT_TRACK: "1"
      HOME: "/tmp/tmuxde-dev"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      PNPM_HOME: "/tmp/pnpm"
      npm_config_nodedir: "/usr/local"
      CI: "true"
    entrypoint:
      - "/bin/bash"
      - "/usr/local/bin/deps-manager"
    volumes:
      - type: "bind"
        source: "../../package.json"
        target: "/manifests/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../pnpm-lock.yaml"
        target: "/manifests/pnpm-lock.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../pnpm-workspace.yaml"
        target: "/manifests/pnpm-workspace.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../stt/package.json"
        target: "/manifests/stt/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../ui/package.json"
        target: "/manifests/ui/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../packages/crypto/package.json"
        target: "/manifests/packages/crypto/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../packages/protocol/package.json"
        target: "/manifests/packages/protocol/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../packages/ui-kit/package.json"
        target: "/manifests/packages/ui-kit/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../dev/deps-manager.sh"
        target: "/usr/local/bin/deps-manager"
        read_only: true
        bind:
          create_host_path: false
      - type: "volume"
        source: "dependencies"
        target: "/workspace/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "root"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/stt/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "stt"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/ui/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "ui"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/crypto/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "packages-crypto"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/protocol/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "packages-protocol"
      - type: "volume"
        source: "dependencies"
        target: "/workspace/packages/ui-kit/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "packages-ui-kit"
      - type: "volume"
        source: "pnpm-store"
        target: "/pnpm/store"
        read_only: false
        volume:
          nocopy: true

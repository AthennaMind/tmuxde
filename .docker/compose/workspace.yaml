services:
  runtime:
    image: "tmuxde-dev:local"
    build:
      context: "../.."
      dockerfile: ".docker/dev/Dockerfile"
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: "4g"
    cpus: 4
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,mode=1777,size=1g"
    working_dir: "/workspace"
    environment:
      DO_NOT_TRACK: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      PNPM_HOME: "/tmp/pnpm"
      npm_config_nodedir: "/usr/local"
      CI: "${CI:-}"
    volumes:
      - type: "bind"
        source: "../../src/ui/package.json"
        target: "/workspace/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/pnpm-lock.yaml"
        target: "/workspace/pnpm-lock.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/pnpm-workspace.yaml"
        target: "/workspace/pnpm-workspace.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/tsconfig.json"
        target: "/workspace/tsconfig.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/vite.config.ts"
        target: "/workspace/vite.config.ts"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/vitest.config.ts"
        target: "/workspace/vitest.config.ts"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/postcss.config.mjs"
        target: "/workspace/postcss.config.mjs"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/components.json"
        target: "/workspace/components.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/index.html"
        target: "/workspace/index.html"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/public"
        target: "/workspace/public"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/src"
        target: "/workspace/src"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../.gitignore"
        target: "/workspace/.gitignore"
        read_only: true
        bind:
          create_host_path: false
      - type: "volume"
        source: "dependencies"
        target: "/workspace/node_modules"
        read_only: true
        volume:
          nocopy: true
          subpath: "root"
      - type: "volume"
        source: "pnpm-store"
        target: "/pnpm/store"
        read_only: true
        volume:
          nocopy: true
  workspace:
    extends:
      service: runtime
    environment:
      HOME: "/tmp/tmuxde-dev"
    volumes:
      - type: "volume"
        source: "cache"
        target: "/workspace/.cache"
        read_only: false
        volume:
          nocopy: true
          subpath: "workspace-cache"
      - type: "volume"
        source: "cache"
        target: "/workspace"
        volume:
          nocopy: true
          subpath: "ui-tooling-metadata"
      - type: "volume"
        source: "cache"
        target: "/workspace/.vite"
        read_only: false
        volume:
          nocopy: true
          subpath: "ui-vite"
  ui-workspace:
    extends:
      service: runtime
    environment:
      HOME: "/tmp/tmuxde-dev"
    volumes:
      - type: "volume"
        source: "cache"
        target: "/workspace"
        volume:
          nocopy: true
          subpath: "ui-dev-metadata"
      - type: "volume"
        source: "cache"
        target: "/workspace/.vite"
        read_only: false
        volume:
          nocopy: true
          subpath: "ui-vite"
  installer:
    image: "tmuxde-dev:local"
    build:
      context: "../.."
      dockerfile: ".docker/dev/Dockerfile"
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: "4g"
    cpus: 4
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,mode=1777,size=1g"
      - "/workspace:rw,noexec,nosuid,nodev,mode=1777,size=256m"
    working_dir: "/workspace"
    environment:
      DO_NOT_TRACK: "1"
      HOME: "/tmp/tmuxde-dev"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      PNPM_HOME: "/tmp/pnpm"
      npm_config_nodedir: "/usr/local"
      CI: "true"
    entrypoint:
      - "/bin/bash"
      - "/usr/local/bin/deps-manager"
    volumes:
      - type: "bind"
        source: "../../src/ui/package.json"
        target: "/manifests/package.json"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/pnpm-lock.yaml"
        target: "/manifests/pnpm-lock.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../../src/ui/pnpm-workspace.yaml"
        target: "/manifests/pnpm-workspace.yaml"
        read_only: true
        bind:
          create_host_path: false
      - type: "bind"
        source: "../dev/deps-manager.sh"
        target: "/usr/local/bin/deps-manager"
        read_only: true
        bind:
          create_host_path: false
      - type: "volume"
        source: "dependencies"
        target: "/workspace/node_modules"
        read_only: false
        volume:
          nocopy: true
          subpath: "root"
      - type: "volume"
        source: "pnpm-store"
        target: "/pnpm/store"
        read_only: false
        volume:
          nocopy: true

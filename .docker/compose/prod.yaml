name: tmuxde

# Production runs the tmuxde binary on the host as the systemd user unit
# tmuxde.service, with the ui build embedded. Build it and install it with
# scripts/setup.sh --host-service, see .docker/README.md. This file runs only
# Caddy in front of it and the optional speech service.

x-contained: &contained
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
  pids_limit: 512

services:
  # Optional speech to text. Starts only with profile `dictation`, which
  # `scripts/setup.sh --dictation` writes to `.env` as COMPOSE_PROFILES.
  stt:
    <<: *contained
    profiles: [dictation]
    build:
      context: ../..
      dockerfile: .docker/prod/stt.Dockerfile
    user: "${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}"
    cpus: ${STT_THREADS:-4}
    mem_limit: 3g
    # No network. The tmuxde binary on the host dials stt.sock, and the
    # image health check uses it too.
    network_mode: none
    environment:
      STT_SOCKET: /run/tmuxde/stt/stt.sock
      STT_MODEL_DIR: /models/parakeet-tdt-0.6b-v3-int8
      STT_VAD_MODEL: /models/silero-vad/silero_vad.onnx
      STT_THREADS: ${STT_THREADS:-4}
    volumes:
      - type: bind
        source: ${LOCAL_STT_MODELS:-/nonexistent}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      # stt subdir of the run directory, the only one it can write.
      # Written by scripts/setup.sh. Owned by the host user, mode 0750.
      - type: bind
        source: ${LOCAL_STT_SOCKET_DIR:?Run scripts/setup.sh}/stt
        target: /run/tmuxde/stt
        bind:
          create_host_path: false
    restart: unless-stopped

  # Caddy proxies to the tmuxde binary on the host over http.sock in the
  # run directory.
  caddy:
    <<: *contained
    cap_add: [NET_BIND_SERVICE]
    # Caddy runs as root without DAC_OVERRIDE. The host user group lets it
    # enter the 0750 run directory and connect to http.sock, which must be
    # group writable. stt/stt.sock has no group write, so Caddy cannot reach
    # it.
    group_add: ["${LOCAL_GID:?Run scripts/setup.sh}"]
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Run directory of the host tmuxde binary. Written by scripts/setup.sh.
      # Owned by the host user, mode 0750.
      - type: bind
        source: ${LOCAL_STT_SOCKET_DIR:?Run scripts/setup.sh}
        target: /run/tmuxde
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:443:443"
    networks: [edge]
    restart: unless-stopped

volumes:
  caddy-data:
    name: tmuxde_caddy-data
  caddy-config:
    name: tmuxde_caddy-config

networks:
  edge:

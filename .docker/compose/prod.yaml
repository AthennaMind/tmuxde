name: tmuxde

x-contained: &contained
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
  pids_limit: 512

services:
  web:
    <<: *contained
    build:
      context: ../..
      dockerfile: .docker/prod/web.Dockerfile
      args:
        NEXT_PUBLIC_RELAY_URL: ""
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    networks: [offline]
    restart: unless-stopped

  relay:
    <<: *contained
    build:
      context: ../..
      dockerfile: .docker/prod/relay.Dockerfile
    user: "${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}"
    # Browsers learn about dictation once, at login. Waiting for the model
    # keeps phones that reconnect during a restart from losing the mic.
    # Ignored when profile `dictation` is off.
    depends_on:
      stt:
        condition: service_healthy
        required: false
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "24300"
      TMUX_SOCKET: /host-tmux/${LOCAL_TMUX_SOCKET:?Run scripts/setup.sh}
      AUTH_TOKEN: ${AUTH_TOKEN:?Run scripts/setup.sh}
      CORS_ORIGINS: https://${LOCAL_DOMAIN:-localhost}
      ALLOWED_PATHS: ${LOCAL_UPLOAD_DIR:?Run scripts/setup.sh},${LOCAL_HOST_HOME:?Run scripts/setup.sh}
      HOME: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
      TMUXDE_CONFIG_DIR: /tmp/tmuxde-state
      # Empty unless setup enabled dictation. Relay then offers no mic.
      STT_URL: ${STT_URL:-}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - type: bind
        source: ${LOCAL_TMUX_DIR:?Run scripts/setup.sh}
        target: /host-tmux
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
        target: ${LOCAL_HOST_HOME:?Run scripts/setup.sh}
        read_only: true
        bind:
          create_host_path: false
      - ../host-tmux:/opt/host-tmux:ro
      - ../tmux-client:/usr/local/bin/tmux:ro
      - type: bind
        source: ${LOCAL_UPLOAD_DIR:?Run scripts/setup.sh}
        target: ${LOCAL_UPLOAD_DIR:?Run scripts/setup.sh}
        bind:
          create_host_path: false
    networks: [offline, speech]
    restart: unless-stopped

  # Optional speech to text. Starts only with profile `dictation`, which
  # `scripts/setup.sh --dictation` writes to `.env` as COMPOSE_PROFILES.
  stt:
    <<: *contained
    profiles: [dictation]
    build:
      context: ../..
      dockerfile: .docker/prod/stt.Dockerfile
    user: "${LOCAL_UID:?Run scripts/setup.sh}:${LOCAL_GID:?Run scripts/setup.sh}"
    cpus: ${STT_THREADS:-4}
    mem_limit: 3g
    environment:
      STT_MODEL_DIR: /models/parakeet-tdt-0.6b-v3-int8
      STT_VAD_MODEL: /models/silero-vad/silero_vad.onnx
      STT_THREADS: ${STT_THREADS:-4}
    volumes:
      - type: bind
        source: ${LOCAL_STT_MODELS:-/nonexistent}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks: [speech]
    restart: unless-stopped

  caddy:
    <<: *contained
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:443:443"
    networks: [edge, offline]
    depends_on:
      web:
        condition: service_healthy
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
    name: tmuxde_caddy-data
  caddy-config:
    name: tmuxde_caddy-config

networks:
  edge:
  offline:
    internal: true
  # Relay and speech service only. Web and Caddy cannot reach it.
  speech:
    internal: true
